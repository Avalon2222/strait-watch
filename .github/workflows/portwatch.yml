name: update portwatch

on:
  schedule:
    - cron: "0 3 * * 1"   # setiap Senin 10.00 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas==3.1.0
      - run: python scripts/perbarui_portwatch.py
      - name: Commit jika ada perubahan
        run: |
          if git diff --quiet data/; then
            echo "Tidak ada data baru."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/portwatch_harian.csv data/portwatch_chokepoint.csv
            git commit -m "Update data PortWatch"
            git push
          fi
